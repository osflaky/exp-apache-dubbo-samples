name: Dubbo 3.3

on:
  workflow_dispatch:

env:
  FORK_COUNT: 2
  FAIL_FAST: 0
  SHOW_ERROR_DETAIL: 1
  BUILD_OPTS: --batch-mode --no-snapshot-updates --no-transfer-progress 
    --settings ${{github.workspace}}/.mvn/settings.xml 
    -Dmaven.wagon.http.retryHandler.count=3 clean package 
    dependency:copy-dependencies -DskipTests
  VERSIONS_LIMIT: 4
  CANDIDATE_VERSIONS: ' spring.version:5.3.24,6.1.5; spring-boot.version:2.7.6,3.2.3; '
  DUBBO_REF: '3.3'

jobs:
  build-samples:
    needs: [build-dubbo]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    defaults:
      run:
        shell: bash
    steps:
      # Refer to https://github.com/actions/runner-images/issues/2840
      # Current dubbo-samples is too huge and `System.IO.IOException: No space left on device` will be thrown
      # during building it on current github-hosted running system, it should be split into two or more small
      # projects in the future.
      # For now, we should clean some unnecessary system files to make room for the building action.
    - name: Clean unnecessary system files
      run: |
        # These paths only exist on Linux/macOS runners; Windows runners have no sudo
        # and keep their tool cache on a separate, large drive.
        if [ "$RUNNER_OS" != "Windows" ]; then
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        fi
    - name: Configure git for Windows
      run: |
        # Keep LF line endings so mvnw, .mvn/wrapper/*.properties and the bash scripts
        # are read correctly (CRLF breaks the wrapper jar download URL), and allow
        # sample paths longer than the 260-character MAX_PATH limit.
        if [ "$RUNNER_OS" == "Windows" ]; then
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true
        fi
    - uses: actions/checkout@v3
    - name: Cache local Maven repository
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-samples-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-samples-maven-
    - name: Dubbo cache
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository/org/apache/dubbo
        key: ${{ runner.os 
          }}-dubbo-snapshot-${{needs.build-dubbo.outputs.commit_id}}
      # protoc has no windows-aarch_64 build, and protobuf-maven-plugin starts JVM protoc plugins
      # (protoc-gen-dubbo) through an x64 WinRun4J launcher that cannot load an ARM64 jvm.dll.
      # On Windows ARM64, use the x64 JDK, which runs under the OS's built-in x64 emulation. Maven,
      # os-maven-plugin, protoc and the protoc plugins then all use x86_64, which is published.
      # Every module is still built and every proto is still compiled on the windows-11-arm runner.
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 21
        architecture: ${{ (matrix.os == 'windows-latest' && matrix.arch == 
          'arm64') && 'x64' || matrix.arch }}
    - name: Filter modules by Dubbo version
      id: filter-modules
      run: |
        EXCLUDED=$(bash ./test/scripts/filter-build-modules.sh ${{ needs.build-dubbo.outputs.version }})
        echo "excluded_modules=$EXCLUDED" >> $GITHUB_OUTPUT
        echo "Excluded modules: $EXCLUDED"
    - name: Build with Maven
      run: |
        # The bash Maven wrapper cannot bootstrap MavenWrapperMain under Git Bash on
        # Windows; use the runner's preinstalled Maven there, like run-tests.sh does.
        MVN=./mvnw
        if [ "$RUNNER_OS" == "Windows" ]; then
          MVN=mvn
        fi
        $MVN $BUILD_OPTS ${{ steps.filter-modules.outputs.excluded_modules }}
    - name: Clean with Maven
      run: |
        MVN=./mvnw
        if [ "$RUNNER_OS" == "Windows" ]; then
          MVN=mvn
        fi
        $MVN --batch-mode --no-snapshot-updates --no-transfer-progress --settings "$GITHUB_WORKSPACE/.mvn/settings.xml" clean

    name: build-samples [${{ matrix.expander_leg }}]
    timeout-minutes: 150
  build-dubbo:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
    outputs:
      commit_id: ${{ steps.git-checker.outputs.commit_id }}
      version: ${{ steps.git-checker.outputs.version }}
    steps:
    - uses: actions/checkout@v3
      with:
        repository: 'apache/dubbo'
        ref: ${{env.DUBBO_REF}}
    - name: Get commit id and dubbo version
      id: git-checker
      run: |
        REVISION=$(awk '/<revision>[^<]+<\/revision>/{gsub(/<revision>|<\/revision>/,"",$1);print $1;exit;}' pom.xml)
        echo "::set-output name=version::$REVISION"
        echo "dubbo version: $REVISION"
        commit_id=$(git log --format="%H" -n 1)
        echo "::set-output name=commit_id::$commit_id"
        echo "commit_id: $commit_id"
    - name: Dubbo cache
      id: dubbocache
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository/org/apache/dubbo
        key: ${{ runner.os 
          }}-dubbo-snapshot-${{steps.git-checker.outputs.commit_id}}
    - name: Cache local Maven repository
      if: steps.dubbocache.outputs.cache-hit != 'true'
      uses: actions/cache@v3
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-dubbo-${{env.DUBBO_REF}}-maven-${{ 
          hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-dubbo-${{env.DUBBO_REF}}-maven-
    - name: Set up JDK 17
      if: steps.dubbocache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: 17
    - name: Build dubbo
      if: steps.dubbocache.outputs.cache-hit != 'true'
      run: |
        ./mvnw --batch-mode --no-snapshot-updates --no-transfer-progress clean install -Dmaven.test.skip=true -Dmaven.test.skip.exec=true

